# input file for Stokes flow

[mesh]
shape = [100, 25]
size = [500.0, 125.0]

[[mesh.refinement]]
lower_corner = [400.0, 0.0]
upper_corner = [500.0, 125.0]

[rheology]
apply_gravity = true
ice_density = 917.0  # kg/m^3
ice_temperature = 263.15  # K

[boundary_conditions]
left = "free slip"
bottom = "free slip"

[solver]
convergence_tolerance = 1.0e-6
max_iterations = 50
num_steps = 100
time_step = 6.0  # hours
strict_convergence = false # abort if the problem does not converge

[plotting]
output_interval = 4
plot_cauchy_stress = true
plot_deviatoric_stress = true
plot_strain_rate = false
