# input file for Stokes flow

[mesh]
shape = [100, 25]
size = [500.0, 125.0]

[[mesh.refinement]]
lower_corner = [240.0, 0.0]
upper_corner = [260.0, 125.0]

[[mesh.notch]]
lower_corner = [245.0, 115.0]
upper_corner = [255.0, 125.0]

[rheology]
apply_gravity = true
ice_density = 917.0  # kg/m^3
ice_temperature = 263.15  # K

[damage]
b_hat = 5.23e-7  # MPa^-r s^-1
r = 0.43
k1 = -2.63
k2 = 7.24  # MPa^-1
alpha = 0.21
beta = 0.63
length_scale = 10.0  # m
max_damage = 0.99
critical_damage = 0.6

[boundary_conditions]
left = "free slip"
bottom = "free slip"

[solver]
convergence_tolerance = 1.0e-6
max_iterations = 50
num_steps = 480
time_step = 1.0  # hours
strict_convergence = false # abort if the problem does not converge

[plotting]
output_interval = 6
plot_cauchy_stress = true
plot_deviatoric_stress = true
plot_strain_rate = false
