# input file for Stokes flow

[mesh]
shape = [100, 25]
size = [500.0, 125.0]

[[mesh.refinement]]
lower_corner = [240.0, 0.0]
upper_corner = [260.0, 125.0]

[[mesh.notch]]
lower_corner = [245.0, 115.0]
upper_corner = [255.0, 125.0]

[rheology]
apply_gravity = true
ice_density = 917.0  # kg/m^3
ice_temperature = 263.15  # K

[phase_field]
gc = 50.0  # J/m^2
length_scale = 10.0  # m
youngs_modulus = 9.0e9  # Pa
poissons_ratio = 0.33
critical_stress = 0.0  # Pa
residual_stiffness = 1.0e-4

[boundary_conditions]
left = "free slip"
bottom = "free slip"

[solver]
convergence_tolerance = 1.0e-6
max_iterations = 50
num_steps = 480
time_step = 1.0  # hours
strict_convergence = false # abort if the problem does not converge

[plotting]
output_interval = 6
plot_cauchy_stress = true
plot_deviatoric_stress = true
plot_strain_rate = false
