# input file for Stokes flow

[mesh]
shape = [51, 10]
size = [510.0, 100.0]

[[mesh.refinement]]
lower_corner = [230.0, 50.0]
upper_corner = [280.0, 100.0]

[[mesh.refinement]]
lower_corner = [240.0, 60.0]
upper_corner = [270.0, 100.0]

[[mesh.notch]]
lower_corner = [250.0, 90.0]
upper_corner = [260.0, 100.0]

[rheology]
apply_gravity = true
ice_density = 917.0  # kg/m^3
ice_temperature = 263.15  # K

[damage]
b_hat = 5.23e-7  # MPa^-r s^-1
r = 0.43
k1 = -2.63
k2 = 7.24  # MPa^-1
alpha = 0.21
beta = 0.63
length_scale = 10.0  # m
kappa = 2.0
max_damage = 0.99
critical_damage = 0.6

[boundary_conditions]
left = "free slip"
bottom = "free slip"

[solver]
convergence_tolerance = 1.0e-6
max_iterations = 50
num_steps = 160
time_step = 3.0  # hours
strict_convergence = false # abort if the problem does not converge

[plotting]
output_interval = 4
plot_cauchy_stress = true
plot_deviatoric_stress = true
plot_strain_rate = false
